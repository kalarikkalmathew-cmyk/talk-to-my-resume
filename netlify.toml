[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["system-prompt.md"]
  timeout = 20

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/.well-known/ai-resume.json"
  to = "/ai-resume.json"
  status = 200

[[redirects]]
  from = "/resume.pdf"
  to = "/public/mathew-kalarikkal-resume.pdf"
  status = 200
